<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guided workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #14201C; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 20px 20px 24px 20px; gap: 20px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="Main.dc.html" aria-label="Leave the workout" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #C9D2CE; color: #14201C; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
<div style="font-size: 16px; font-weight: 700">Back routine</div>
<div style="font-size: 13px; color: #4D5A55">Move 2 of 6 · 11 min left</div>
</div>
<button aria-label="Voice cues are on" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6l-5 4z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></svg>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
<div style="height: 5px; border-radius: 3px; background: #14201C"></div>
<div style="height: 5px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 5px; border-radius: 3px; background: #DDE3E0"></div>
<div style="height: 5px; border-radius: 3px; background: #DDE3E0"></div>
<div style="height: 5px; border-radius: 3px; background: #DDE3E0"></div>
<div style="height: 5px; border-radius: 3px; background: #DDE3E0"></div>
</div>

<div style="flex: 1 1 auto; min-height: 0; border-radius: 20px; background: #EDF1EF; border: 1.5px dashed #A9B4AF; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4D5A55; text-align: center; padding: 16px">Exercise illustration<br>from the catalogue</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">Side plank</h1>
<div style="font-size: 15px; color: #4D5A55">Left side · hips high, body in one line</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="font-size: 72px; line-height: 76px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">0:18</div>
<div style="font-size: 13px; color: #4D5A55">of 30 seconds</div>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 20px">
<button aria-label="Previous move" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
</button>
<button aria-label="Pause" style="width: 76px; height: 76px; border-radius: 38px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="9" y1="6" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="18"></line></svg>
</button>
<button aria-label="Next move" style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
</button>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #EDF1EF; border-radius: 14px; padding: 12px 14px">
<div style="display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 12px; font-weight: 600; color: #4D5A55">Up next</div>
<div style="font-size: 15px; font-weight: 600">Side plank · right side</div>
</div>
<div style="font-size: 13px; color: #4D5A55">30 s</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Routine.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #14201C">Change the moves</a>
<a href="After.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #14201C">Finish now</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B5C","options":["#0F6B5C","#1D4ED8","#B4530B","#7C3AED"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent || '#0F6B5C' };
}
}
</script>
</body>
</html>
