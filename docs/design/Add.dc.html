<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add something</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6F7774; color: #14201C; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

<div style="background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 16px 20px 16px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; justify-content: center"><div style="width: 40px; height: 4px; border-radius: 2px; background: #C9D2CE"></div></div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Add</h1>
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #C9D2CE; color: #14201C; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<button style="text-align: left; border-radius: 16px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; padding: 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 14px; height: 14px; border-radius: 7px; background: #4D5A55; flex: 0 0 auto"></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">Something I did</span>
<span style="font-size: 13px; color: #4D5A55">A walk, a game, a swim. It counts toward recovery.</span>
</span>
</button>
<button style="text-align: left; border-radius: 16px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; padding: 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1.5px solid {{accent}}; background: {{flexFill}}; flex: 0 0 auto"></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">Something I want to do</span>
<span style="font-size: 13px; color: #4D5A55">The app finds the best spot, and you can move it.</span>
</span>
</button>
<button style="text-align: left; border-radius: 16px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; padding: 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 14px; height: 14px; border-radius: 4px; background: #14201C; flex: 0 0 auto"></span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">A fixed session</span>
<span style="font-size: 13px; color: #4D5A55">A class or practice at a set time, once or repeating.</span>
</span>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #4D5A55; padding: 0 4px">I'm busy</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 600">This evening</button>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 600">Tomorrow</button>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 600">This weekend</button>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 600">Pick dates</button>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 600">Repeating</button>
</div>
<div style="font-size: 13px; color: #4D5A55; padding: 0 4px">One tap is enough. The app moves flexible workouts out of the way and tells you what changed.</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #EDF1EF; border-radius: 14px; padding: 12px 14px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; font-weight: 600">Use my phone calendar</div>
<div style="font-size: 13px; color: #4D5A55">Events become busy time automatically.</div>
</div>
<button aria-label="Use my phone calendar, on" aria-pressed="true" style="width: 52px; height: 44px; border: none; background: transparent; padding: 0; flex: 0 0 auto; display: flex; align-items: center">
<span style="width: 52px; height: 30px; border-radius: 15px; background: #14201C; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span>
</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B5C","options":["#0F6B5C","#1D4ED8","#B4530B","#7C3AED"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var accent = this.props.accent || '#0F6B5C';
return { accent: accent, flexFill: accent + '73' };
}
}
</script>
</body>
</html>
