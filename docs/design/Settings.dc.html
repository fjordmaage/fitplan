<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goals and settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EBEFED; color: #14201C; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 20px 16px 28px 16px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Main.dc.html" aria-label="Back to the plan" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"></polyline></svg>
</a>
<h1 style="margin: 0; font-size: 24px; line-height: 28px; font-weight: 700">Goals and settings</h1>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">How much to train</h2>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<button style="height: 48px; border-radius: 10px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 12px; font-weight: 500; padding: 0">Recover</button>
<button style="height: 48px; border-radius: 10px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 12px; font-weight: 500; padding: 0">Lighter</button>
<button style="height: 48px; border-radius: 10px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 12px; font-weight: 700; padding: 0">Steady</button>
<button style="height: 48px; border-radius: 10px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 12px; font-weight: 500; padding: 0">Build</button>
<button style="height: 48px; border-radius: 10px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 12px; font-weight: 500; padding: 0">Push</button>
</div>
<div style="font-size: 13px; line-height: 18px; color: #4D5A55">Steady keeps you where you are: about 4 sessions every 7 days, with the load held level.</div>
<div style="height: 1px; background: #E3E8E5"></div>
<button style="height: 44px; border: none; background: transparent; color: #14201C; padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 15px; font-weight: 600">Goal</span>
<span style="font-size: 15px; color: #4D5A55">General fitness</span>
</button>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">When the plan needs to change</h2>
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 15px; font-weight: 500; text-align: left; padding: 0 14px">Ask me first</button>
<button style="min-height: 48px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 15px; font-weight: 700; text-align: left; padding: 0 14px">Change it, then tell me why</button>
<button style="min-height: 48px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 15px; font-weight: 500; text-align: left; padding: 0 14px">Only tell me about big changes</button>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; font-weight: 600">Keep the next 2 days steady</div>
<div style="font-size: 13px; color: #4D5A55">Near-term plans only move if you ask.</div>
</div>
<button aria-label="Keep the next 2 days steady, on" aria-pressed="true" style="width: 52px; height: 44px; border: none; background: transparent; padding: 0; flex: 0 0 auto; display: flex; align-items: center">
<span style="width: 52px; height: 30px; border-radius: 15px; background: #14201C; display: flex; align-items: center; justify-content: flex-end; padding: 0 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span>
</button>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">Look</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">Same as phone</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Light</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Dark</button>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Green accent, selected" style="width: 44px; height: 44px; border-radius: 22px; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #14201C; background: #0F6B5C; padding: 0"></button>
<button aria-label="Blue accent" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1D4ED8; padding: 0"></button>
<button aria-label="Orange accent" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #B4530B; padding: 0"></button>
<button aria-label="Purple accent" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #7C3AED; padding: 0"></button>
<button style="flex: 1 1 auto; height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 600">Any colour</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="font-size: 15px; font-weight: 600">Match my wallpaper</div>
<button aria-label="Match my wallpaper, off" aria-pressed="false" style="width: 52px; height: 44px; border: none; background: transparent; padding: 0; flex: 0 0 auto; display: flex; align-items: center">
<span style="width: 52px; height: 30px; border-radius: 15px; background: #A9B4AF; display: flex; align-items: center; justify-content: flex-start; padding: 0 3px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span>
</button>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 6px 16px">
<button style="width: 100%; height: 48px; border: none; background: transparent; color: #14201C; padding: 0; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">About you</span><span style="font-size: 14px; color: #4D5A55">Age, height, weight</span>
</button>
<div style="height: 1px; background: #E3E8E5"></div>
<button style="width: 100%; height: 48px; border: none; background: transparent; color: #14201C; padding: 0; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Voice and sound</span><span style="font-size: 14px; color: #4D5A55">Spoken cues on</span>
</button>
<div style="height: 1px; background: #E3E8E5"></div>
<button style="width: 100%; height: 48px; border: none; background: transparent; color: #14201C; padding: 0; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Reminders</span><span style="font-size: 14px; color: #4D5A55">Morning summary</span>
</button>
<div style="height: 1px; background: #E3E8E5"></div>
<button style="width: 100%; height: 48px; border: none; background: transparent; color: #14201C; padding: 0; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Connections</span><span style="font-size: 14px; color: #4D5A55">Health Connect, calendar</span>
</button>
<div style="height: 1px; background: #E3E8E5"></div>
<button style="width: 100%; height: 48px; border: none; background: transparent; color: #14201C; padding: 0; display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">Your data</span><span style="font-size: 14px; color: #4D5A55">Export or back up</span>
</button>
</div>

</div>
</div>
</x-dc>
