<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not feeling 100%</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #14201C; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 20px 20px 24px 20px; gap: 20px">

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em">Not feeling 100%</h1>
<div style="font-size: 14px; color: #4D5A55">The app eases the plan and brings you back gently.</div>
</div>
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #C9D2CE; color: #14201C; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">What's going on?</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">Ill</button>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Aches or pain</button>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Busy period</button>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Just tired</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">What should change?</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<button style="height: 48px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 15px; font-weight: 500; text-align: left; padding: 0 14px">Only easy sessions</button>
<button style="height: 48px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 15px; font-weight: 500; text-align: left; padding: 0 14px">Shorter sessions</button>
<button style="height: 48px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 15px; font-weight: 700; text-align: left; padding: 0 14px">A full break</button>
<button style="height: 48px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 15px; font-weight: 500; text-align: left; padding: 0 14px">Keep fixed sessions, drop the rest</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">For how long?</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">3 days</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">1 week</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Until I say</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">Coming back</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">Slowly</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Balanced</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Quickly</button>
</div>
</div>

<div style="font-size: 13px; line-height: 18px; color: #4D5A55">For pain that is sharp or doesn't go away, see a doctor or physiotherapist.</div>

<div style="flex: 1 1 auto"></div>

<a href="Main.dc.html" style="height: 48px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Ease my plan</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B5C","options":["#0F6B5C","#1D4ED8","#B4530B","#7C3AED"]},"$preview":{"width":390,"height":844}}'>

return { accent: this.props.accent || '#0F6B5C' };
}
}
</script>
</body>
</html>
