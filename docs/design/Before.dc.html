<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check-in before a workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:#0F6B5C}a:hover{color:#0A4F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #14201C; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 20px 20px 24px 20px; gap: 22px">

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #4D5A55">Before today's workout</div>
<h1 style="margin: 0; font-size: 26px; line-height: 30px; font-weight: 700; letter-spacing: -0.01em">How do you feel?</h1>
</div>
<a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #C9D2CE; color: #14201C; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">Legs</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">Fresh</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">A bit sore</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Sore</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">Back</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">Fresh</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">A bit sore</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Sore</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">Arms and fingers</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Fresh</button>
<button style="height: 44px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">A bit sore</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Sore</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 14px; font-weight: 600">Energy</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">Low</button>
<button style="height: 44px; border-radius: 12px; border: 2px solid #14201C; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 700">Normal</button>
<button style="height: 44px; border-radius: 12px; border: 1px solid #C9D2CE; background: #FFFFFF; color: #14201C; font-size: 14px; font-weight: 500">High</button>
</div>
</div>
</div>

<div style="font-size: 14px; line-height: 20px; background: #DDF0E4; color: #17603A; border-radius: 12px; padding: 12px 14px">Good to go as planned: 6 km at an easy pace. Sore arms don't matter for a run.</div>

<div style="flex: 1 1 auto"></div>

<div style="display: flex; flex-direction: column; gap: 8px">
<a href="Guide.dc.html" style="height: 48px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Start with the guide</a>
<a href="After.dc.html" style="height: 46px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C9D2CE; color: #14201C; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">I'll do it on my own</a>
<a href="Unwell.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #14201C">Not feeling 100%?</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0F6B5C","options":["#0F6B5C","#1D4ED8","#B4530B","#7C3AED"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent || '#0F6B5C' };
}
}
</script>

</html>
